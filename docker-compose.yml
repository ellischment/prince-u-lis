services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* нужны Next во время сборки (robots.txt, sitemap.xml,
      # заголовки, канонические ссылки). Значения берутся из .env — docker compose
      # читает его для подстановки ${...}. Пусто — соберётся без индекс-запрета.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_NOINDEX: ${NEXT_PUBLIC_NOINDEX:-}
        NEXT_PUBLIC_METRIKA_ID: ${NEXT_PUBLIC_METRIKA_ID:-}
    restart: unless-stopped
    env_file: .env
    environment:
      # Next standalone слушает адрес из HOSTNAME, а Docker кладёт туда
      # идентификатор контейнера: сервер садится на его личный адрес, и
      # localhost:3000 ВНУТРИ контейнера не отвечает. Снаружи (app:3000) всё
      # работало, поэтому промах виден только на проверке готовности в
      # scripts/deploy.sh, которая ходит на localhost и всегда падала по таймауту.
      HOSTNAME: 0.0.0.0
    volumes:
      # База и загруженные файлы живут в томах.
      # Обновление образа их не трогает.
      - db-data:/app/prisma/data
      - uploads:/app/public/uploads
      - backups:/app/backups
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  uploads:
  backups:
  caddy-data:
  caddy-config:
