services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # База и загруженные файлы живут в томах.
      # Обновление образа их не трогает.
      - db-data:/app/prisma/data
      - uploads:/app/public/uploads
      - backups:/app/backups
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  uploads:
  backups:
  caddy-data:
  caddy-config:
