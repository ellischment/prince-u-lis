services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* нужны Next во время сборки (robots.txt, sitemap.xml,
      # заголовки, канонические ссылки). Значения берутся из .env — docker compose
      # читает его для подстановки ${...}. Пусто — соберётся без индекс-запрета.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_NOINDEX: ${NEXT_PUBLIC_NOINDEX:-}
        NEXT_PUBLIC_METRIKA_ID: ${NEXT_PUBLIC_METRIKA_ID:-}
    restart: unless-stopped
    # Потолок памяти. На сервере 1966 МБ и своп: без лимита пик приложения
    # съедает всю память, и OOM-killer выбирает жертву сам — вместе с
    # приложением может лечь Caddy, и тогда сайт не отвечает вовсе. С лимитом
    # падает только контейнер приложения, а restart поднимает его обратно.
    mem_limit: 1200m
    memswap_limit: 1600m
    # Логи Docker по умолчанию растут без предела и рано или поздно займут диск.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: .env
    environment:
      # Next standalone слушает адрес из HOSTNAME, а Docker кладёт туда
      # идентификатор контейнера: сервер садится на его личный адрес, и
      # localhost:3000 ВНУТРИ контейнера не отвечает. Снаружи (app:3000) всё
      # работало, поэтому промах виден только на проверке готовности в
      # scripts/deploy.sh, которая ходит на localhost и всегда падала по таймауту.
      HOSTNAME: 0.0.0.0
    volumes:
      # База и загруженные файлы живут в томах.
      # Обновление образа их не трогает.
      - db-data:/app/prisma/data
      - uploads:/app/public/uploads
      - backups:/app/backups
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy в покое ест ~35 МБ. Лимит нужен не ему, а чтобы он гарантированно
    # пережил пик приложения и отдал гостю понятную страницу вместо тишины.
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  uploads:
  backups:
  caddy-data:
  caddy-config:
