# Положить в .github/workflows/check.yml
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Типы
        run: npx tsc --noEmit

      - name: Линтер
        run: npx next lint

      - name: Тесты
        run: npm run test:unit

      - name: Сборка
        run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"
          SESSION_SECRET: "ci-secret-ci-secret-ci-secret-32"
          ENCRYPTION_KEY: "ci-key-ci-key-ci-key-ci-key-32ch"
