name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./data/ci.db"
      SESSION_SECRET: "ci-secret-ci-secret-ci-secret-32"
      ENCRYPTION_KEY: "ci-key-ci-key-ci-key-ci-key-32ch"
      CRON_SECRET: "ci-cron-secret-16"
      NEXT_PUBLIC_SITE_URL: "https://ci.example.invalid"
      # Только для сквозного сценария входа в панель, не боевые значения.
      SEED_OWNER_EMAIL: "owner@ci.example.invalid"
      SEED_OWNER_PASSWORD: "ci-owner-password-not-real"
      SEED_ADMIN_EMAIL: "admin@ci.example.invalid"
      SEED_ADMIN_PASSWORD: "ci-admin-password-not-real"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # Миграция нужна до сборки: generateStaticParams на страницах занятий
      # читает базу через Prisma, без применённой схемы это «no such table».
      - name: Миграция базы
        run: npx prisma migrate deploy

      # До сборки: /zanyatiya/[slug] предгенерируется статически по данным
      # из базы (generateStaticParams), без сида сборка даст ноль страниц
      # занятий, и сквозной сценарий ниже не найдёт «Гончарный круг».
      - name: Сид базы
        run: npm run seed

      - name: Типы
        run: npx next typegen && npx tsc --noEmit

      - name: Линтер
        run: npm run lint

      - name: Модульные тесты
        run: npm run test:unit

      - name: Сборка
        run: npm run build

      - name: Браузер для сквозных тестов
        run: npx playwright install --with-deps chromium

      - name: Сквозные тесты
        run: npm run test:e2e
